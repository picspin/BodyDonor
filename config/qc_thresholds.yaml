cold_start:
  dataset: totalsegmentator_ct_lite
  n_cases: 25
  calibrated_at: '2026-11-07'
  method: dice_correlation
rules:
  volume_prior:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    min_frac: 0.0001
    max_frac: 0.65
  connected_component:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    min_main_frac: 0.8
    max_components: 20
  holes:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    max_hole_frac: 0.2
  boundary_smoothness:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    max_boundary_ratio: 1.2
  hu_distribution:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    min_hu: -200
    max_hu: 400
    percentile: 5
    skip_bone_classes: true
  multi_teacher_consistency:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    note: M4 启用（学生模型 student-nnunet-v2-distill-20261109T062920Z 已出现）。聚合方式 = 参与比较类的
      mean Dice（不是最差类）——校准依据（2026-11-11 实测，教师 vs 学生逐类 Dice，30 例）：419 对 mean 0.8560、p10
      0.6986；case 级最差类聚合在 0.80 下 flag 24/30 例（无判别力，基本等于全审），均值聚合 flag 5/30 例（有判别力，flag
      的正是分歧最大的 5 例）。阈值数值保持 0.80 初值不改——本次校准的是聚合方式，不是数值重算（source 保持 cold_start、calibrated_on
      保持 0）。单图 QC 无学生 mask 时显式 skipped，不进 flags、不计入 enabled 分母。
    threshold: 0.8
  interaction_convergence:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    note: cold_start 未校准：M6-a 采集 2026-11-12 起，无回放语料；初值为量级假设，M6-f 决策回流后重算。两层逻辑：普通类（teacherReliability=high）看
      numPrompts/convergenceSteps；高风险类（prostate + 39 低频名单，teacherReliability=low）不看
      convergenceSteps、不看 finalLocalDice，只看 numPrompts。abandonedAttempts 归 interaction_abandonment
      规则。
    n_max_prompts: 15
    k_max_steps: 6
  interaction_abandonment:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    note: cold_start 未校准：放弃计数采集始于 M6-a（2026-11-12），无回放语料；min_abandonments=1 为高 flag
      初值（放弃一次即记信号），M6-f 决策回流后重算。
    min_abandonments: 1
  left_right_symmetry:
    enabled: true
    source: cold_start
    calibrated_on: 20
    calibrated_at: '2026-11-12'
    max_log_ratio: 1.0
    pairs:
    - - kidney_left
      - kidney_right
    - - adrenal_gland_left
      - adrenal_gland_right
    - - femur_left
      - femur_right
    - - gluteus_maximus_left
      - gluteus_maximus_right
    - - gluteus_medius_left
      - gluteus_medius_right
    - - gluteus_minimus_left
      - gluteus_minimus_right
    - - iliopsoas_left
      - iliopsoas_right
    - - autochthon_left
      - autochthon_right
    - - lung_upper_lobe_left
      - lung_upper_lobe_right
    - - lung_lower_lobe_left
      - lung_lower_lobe_right
    - - humerus_left
      - humerus_right
    - - scapula_left
      - scapula_right
    - - clavicula_left
      - clavicula_right
    - - brachiocephalic_vein_left
      - brachiocephalic_vein_right
    - - subclavian_artery_left
      - subclavian_artery_right
    - - common_carotid_artery_left
      - common_carotid_artery_right
    - - iliac_artery_left
      - iliac_artery_right
    - - iliac_vena_left
      - iliac_vena_right
    - - temporalis_left
      - temporalis_right
    - - pectoralis_major_left
      - pectoralis_major_right
    - - rectus_abdominis_left
      - rectus_abdominis_right
    - - trapezius_left
      - trapezius_right
    - - sternocleidomastoid_left
      - sternocleidomastoid_right
    - - semispinalis_left
      - semispinalis_right
review_sampling:
  flagged_ratio: 0.7
  clean_ratio: 0.3
  batch_size: 10
  min_clean_pool: 1
sampling_priority:
  enabled: true
  source: cold_start
  calibrated_on: 0
  calibrated_at: ''
  note: 权重是冷启动起点，未经校准：等权 w1=w2=w3=w4=1（2026-11-12）。M4 已证明冷启动 QC flag 区分度低（419 对均值聚合
    flag 5/30），flagged/clean 二分在 flag 少时退化成随机抽检；过程风险连续分数按 priority 降序取前 batch_size
    名建 ReviewTask。w3 聚合方式 = 最差类（1 - min 逐类 Dice，非 mean）：mean 会稀释单类整类漏检（实测 s0495 prostate
    整类漏检 min 0.0 而 mean 0.8771，mean 聚合排不进前 20%）；冷启动抽检目的是找出最坏的 case 交人审，宁过审不漏审。M6-f
    决策回流后重算权重（calibrated_on 更新）。
  weights:
    w1: 1.0
    w2: 1.0
    w3: 1.0
    w4: 1.0
gating:
  enabled: true
  source: cold_start
  calibrated_on: 0
  calibrated_at: ''
  forced_ratio: 0.2
  suggested_ratio: 0.6
  auto_ratio: 0.2
overall:
  min_score: 0.5
  hard_flag_rules:
  - volume_prior
  decisions:
    accepted: 12
    rejected: 8
  calibrated_on: 20
  calibrated_at: '2026-11-12'
