<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BodyDonor 审阅台</title>
<script src="/static/niivue.umd.js"></script>
<style>
  /* 放射科阅片室色系：深炭黑底，骨窗琥珀强调，病理青蓝；无渐变无阴影 */
  :root {
    --bg: #101418;
    --panel: #171d23;
    --line: #232c34;
    --text: #c4cdd4;
    --dim: #6b7780;
    --amber: #d9a441;   /* 骨窗琥珀：当前激活/主强调 */
    --cyan: #4fa3b5;    /* 病理青蓝：运行/信息 */
    --green: #5fa867;
    --red: #c75450;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.5 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; color: var(--amber); }
  header .series { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
  header .status { margin-left: auto; color: var(--dim); font-size: 12px; }
  header .status.ok { color: var(--green); }
  header .status.err { color: var(--red); }

  main { flex: 1; display: flex; min-height: 0; }

  /* 视口区：左 2×2 网格，axial 主视口占左上大格 */
  #viewport-grid {
    flex: 1; display: grid; min-width: 0;
    grid-template-columns: 3fr 2fr; grid-template-rows: 3fr 2fr; gap: 4px; padding: 4px;
  }
  .vp { position: relative; background: #000; border: 1px solid var(--line); min-height: 0; }
  .vp canvas { width: 100%; height: 100%; display: block; }
  .vp .label {
    position: absolute; left: 8px; top: 6px; font-size: 12px; color: var(--dim);
    background: rgba(16,20,24,.7); padding: 1px 6px; pointer-events: none;
  }
  #vp-axial { grid-column: 1; grid-row: 1; }
  #vp-coronal { grid-column: 2; grid-row: 1; }
  #vp-sagittal { grid-column: 1; grid-row: 2; }
  #vp-mip { grid-column: 2; grid-row: 2; }

  /* 右侧控制栏 */
  aside {
    width: 280px; flex-shrink: 0; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .ctrl-group { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .ctrl-group h2 { font-size: 12px; font-weight: 600; color: var(--dim); margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row label { color: var(--dim); font-size: 13px; min-width: 56px; }
  input[type=range] { flex: 1; accent-color: var(--amber); }
  .val { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--cyan); font-size: 12px; }

  /* mask 类别开关列表 */
  #seg-list { max-height: 40vh; overflow-y: auto; }
  .seg-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; }
  .seg-item input[type=checkbox] { accent-color: var(--amber); }
  .seg-item .swatch { width: 12px; height: 12px; flex-shrink: 0; border: 1px solid var(--line); }
  .seg-item .n { margin-left: auto; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .seg-item input[type=color] { width: 22px; height: 18px; padding: 0; border: none; background: none; }

  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 6px 12px; font-size: 13px; cursor: pointer; border-radius: 3px;
  }
  button:hover { border-color: var(--amber); color: var(--amber); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
  button.primary { border-color: var(--amber); color: var(--amber); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* 画笔/删除模式切换 */
  .mode-row { display: flex; gap: 6px; }
  .mode-row button.active { border-color: var(--cyan); color: var(--cyan); }

  /* M5：模式徽标 / 提示预览 / 草稿态 / 风险队列 */
  .mode-badge {
    position: absolute; right: 8px; top: 6px; font-size: 12px; color: var(--amber);
    background: rgba(16,20,24,.85); padding: 1px 8px; pointer-events: none;
    border: 1px solid var(--line);
  }
  .mode-badge.draft { color: var(--amber); border-color: var(--amber); }
  .mode-badge.accepted { color: var(--cyan); border-color: var(--cyan); }
  .prompt-preview {
    position: absolute; font-size: 18px; font-weight: 700; pointer-events: none;
    transform: translate(-50%, -50%); text-shadow: 0 0 3px #000;
  }
  .prompt-preview.pos { color: #5fa867; }
  .prompt-preview.neg { color: #c75450; }
  .prompt-preview.box { color: var(--cyan); }
  .prompt-preview.scribble { color: var(--amber); }
  .draft-item { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
  .draft-item .st-draft { color: var(--amber); }
  .draft-item .st-accepted { color: var(--cyan); }
  .draft-item.draft { border-left: 2px dashed var(--amber); padding-left: 6px; }
  .draft-item.accepted { border-left: 2px solid var(--cyan); padding-left: 6px; }
  .risk-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13px; cursor: pointer; }
  .risk-item:hover { color: var(--amber); }
  .risk-item .risk-high { color: var(--red); font-weight: 600; }
  .risk-item .risk-medium { color: var(--amber); }
  .risk-item .risk-low { color: var(--dim); }
  .risk-item .dice { margin-left: auto; color: var(--cyan); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: no-preference) {
    .risk-item.risk-pulse { animation: risk-pulse 1.2s ease-in-out infinite; }
    @keyframes risk-pulse { 50% { background: rgba(217,164,65,.15); } }
  }
  .seg-item.current { outline: 1px solid var(--amber); }

  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 8px 16px; font-size: 13px; border-radius: 3px; display: none;
  }
  #toast.ok { border-color: var(--green); color: var(--green); }
  #toast.err { border-color: var(--red); color: var(--red); }

  footer {
    padding: 6px 16px; border-top: 1px solid var(--line); background: var(--panel);
    color: var(--dim); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap;
  }
  footer .slice-pos { color: var(--cyan); font-variant-numeric: tabular-nums; }
  footer #license-line { min-width: 0; }
  footer #license-line .ni-warning {
    color: var(--red); font-weight: 600; margin-left: 6px;
  }
  @media (prefers-reduced-motion: no-preference) {
    #toast.show { animation: toast-in .18s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }
  }
</style>
</head>
<body>
<header>
  <h1>BodyDonor 审阅台</h1>
  <span class="series" id="series-label">加载中…</span>
  <span class="status" id="hdr-status"></span>
</header>

<main>
  <div id="viewport-grid">
    <div class="vp" id="vp-axial"><span class="label">轴位 Axial</span><span class="mode-badge" id="mode-badge">浏览 ·</span><span class="prompt-preview" id="prompt-preview" hidden>+</span></div>
    <div class="vp" id="vp-coronal"><span class="label">冠状 Coronal</span></div>
    <div class="vp" id="vp-sagittal"><span class="label">矢状 Sagittal</span></div>
    <div class="vp" id="vp-mip"><span class="label">MIP 最大密度投影</span></div>
  </div>

  <aside>
    <div class="ctrl-group">
      <h2>窗宽窗位</h2>
      <div class="row"><label>窗位</label><input type="range" id="ww-center" min="-1000" max="3000" value="400"><span class="val" id="ww-center-v">400</span></div>
      <div class="row"><label>窗宽</label><input type="range" id="ww-width" min="10" max="4000" value="1500"><span class="val" id="ww-width-v">1500</span></div>
    </div>

    <div class="ctrl-group">
      <h2>切片滚动</h2>
      <div class="row"><label>位置</label><input type="range" id="slice-slider" min="0" max="100" value="50"><span class="val" id="slice-v">—</span></div>
      <div class="row">
        <button id="btn-crosshair" title="把十字线移动到当前切片">十字定位</button>
        <button id="btn-reset" title="重置视图">重置</button>
      </div>
    </div>

    <div class="ctrl-group">
      <h2>人工修正</h2>
      <div class="mode-row">
        <button id="mode-none" class="active">浏览</button>
        <button id="mode-erase" title="整类删除：点击 mask 关闭该类别">整类删除</button>
        <button id="mode-paint" title="画笔粗修：拖动擦除当前类">画笔粗修</button>
      </div>
      <!-- M5-a：nnInteractive 提示模式（P/N/B/S 键切换；Esc 回浏览不清提示） -->
      <div class="mode-row" style="margin-top:6px">
        <button id="mode-prompt-pos" title="P：正向提示点 +">+ 正向 (P)</button>
        <button id="mode-prompt-neg" title="N：负向提示点 -">− 负向 (N)</button>
        <button id="mode-bbox" title="B：包围框 &amp;">&amp; 框 (B)</button>
        <button id="mode-scribble" title="S：涂鸦 *">* 涂鸦 (S)</button>
      </div>
      <div class="row" style="margin-top:6px; color:var(--dim); font-size:12px">
        <span id="prompt-hint">空格拖拽平移不落提示 · Esc 回浏览（提示保留）· 点击类别行选当前类</span>
      </div>
      <!-- M5 修正传播：本层 → 相邻层 -->
      <div class="row" style="margin-top:8px">
        <label>传播</label>
        <select id="prop-radius" title="向相邻层传播半径">
          <option value="1" selected>±1 层</option>
          <option value="2">±2 层</option>
        </select>
        <button id="btn-propagate" title="把当前层当前类的形态传播到相邻层空白处">传播到相邻层</button>
      </div>
      <!-- M5-b：per-class 草稿 -->
      <div class="row" style="margin-top:8px; color:var(--dim); font-size:12px"><span>会话草稿（每类独立）</span></div>
      <div id="draft-list"><span style="color:var(--dim)">暂无草稿</span></div>
      <div class="row" style="margin-top:8px">
        <button id="btn-save" class="primary">保存修正（新 MaskVersion）</button>
        <button id="btn-submit-nni" title="提交已确认类的 nnInteractive 修正（M5-e 建 MaskVersion 行）">提交审阅</button>
      </div>
    </div>

    <!-- M5 自适应渲染开关 -->
    <div class="ctrl-group">
      <h2>审阅模式</h2>
      <div class="mode-row">
        <button id="render-quick" title="弱化轮廓、强化类别色块（检测/定位任务默认）">快速定位</button>
        <button id="render-fine" class="active" title="强化 GT 与预测边界差异，偏差区域脉动提示（边界关键任务默认）">精细边界</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btn-strip" title="一键剥离：隐藏全部 overlay，只看原图">一键剥离 overlay</button>
      </div>
    </div>

    <!-- M5 异常驱动队列 -->
    <div class="ctrl-group">
      <h2>优先审阅队列</h2>
      <div id="risk-list"><span style="color:var(--dim)">加载中…</span></div>
    </div>

    <div class="ctrl-group">
      <h2>mask 类别</h2>
      <div id="seg-list"><span style="color:var(--dim)">—</span></div>
      <div class="row" style="margin-top:8px">
        <button id="btn-all-on">全开</button>
        <button id="btn-all-off">全关</button>
      </div>
    </div>
  </aside>
</main>

<footer>
  <span class="slice-pos" id="slice-pos">slice —</span>
  <span id="fps-hint">滚轮/拖动滚动 · 右键窗宽窗位 · 逐类开关在右侧</span>
  <span id="frame-stat" style="margin-left:auto"></span>
  <span id="license-line">license 加载中…</span>
</footer>
<div id="toast"></div>

<script>
// BodyDonor 审阅台（M2 + M2-align 3.5）：三正交面 + 体绘制第 4 视口；
// **只加载 1 张原图 + 1 个合并 mask**（combined_mask.nii.gz，uint8 多标签）+
// labels.json 驱动逐类开关/换色/体素数统计；窗宽窗位；逐 slice 滚动同步重绘；
// 导出人工修正（整类删除 + 画笔粗修，按 label 索引操作）写回 NIfTI
// （POST /review/{series_id}/save）。旧的多文件加载路径已删除，不留两套。
// 不做（非目标）：4D/时间序列、DTI、自由角三维切面、多人协同、DICOM 原生渲染。

const q = new URLSearchParams(location.search);
const SERIES_ID = q.get("series_id") || "";

const $ = (id) => document.getElementById(id);
const toastEl = $("toast");
let toastTimer;
function toast(msg, cls = "") {
  toastEl.textContent = msg;
  toastEl.className = "show " + cls;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = ""; }, 2600);
}

// ---- niivue 多视口 ----------------------------------------------------------
const nvMap = new Map();  // id -> nv instance

function makeNV(canvasParent, options) {
  const canvas = document.createElement("canvas");
  canvasParent.appendChild(canvas);
  const nv = new niivue.Niivue(options);
  nv.attachToCanvas(canvas);
  return nv;
}

// 类别色兜底（labels.json 缺失时才用；正常路径颜色来自 labels.json）
const FALLBACK_PALETTE = [
  [1.0, 0.4, 0.4], [0.4, 0.7, 1.0], [0.5, 0.9, 0.5], [1.0, 0.8, 0.3],
  [0.8, 0.5, 1.0], [0.3, 0.9, 0.9], [1.0, 0.5, 0.8], [0.7, 0.7, 0.3],
  [0.4, 0.6, 0.3], [0.9, 0.6, 0.4], [0.6, 0.4, 0.8], [0.3, 0.5, 0.8],
];
const segState = new Map(); // label_value(int) -> {color:[r,g,b], visible:true, name}

let nvAxial, nvCoronal, nvSagittal, nvMip;
let meta = null;       // {series_id, case_id, num_slices, has_combined_mask, license?}
let segMeta = [];      // [{class, label_value, n_voxels, name_cn?, name_en?, color?}]
let labelsDoc = null;  // {n_classes, labels: [{index, totalseg_class, name_cn, name_en, color}]}

// M4 阶段 3：license 展示位（页脚一行，静态文案 + meta.license 动态内容；
// 该 series 有 nnInteractive 修正产物时红色高亮提示）
function showLicense(m) {
  const el = $("license-line");
  if (!el) return;
  const lic = m && m.license ? m.license : null;
  let html = "license: teacher=TotalSegmentator total（Apache-2.0）· ";
  if (lic && lic.nninteractive_weights) {
    html += `nnInteractive=${lic.nninteractive_weights}`;
  } else {
    html += "nnInteractive=CC BY-NC-SA 4.0（仅交互修正辅助）";
  }
  html += " · 详见 LICENSES-THIRD-PARTY.md";
  if (m && m.correction_source) {
    html += `<span class="ni-warning">⚠ 本序列含 nnInteractive 修正产物（CC BY-NC-SA 4.0）：不进商用蒸馏训练集</span>`;
  }
  el.innerHTML = html;
}

async function loadSeries() {
  if (!SERIES_ID) {
    $("series-label").textContent = "缺 series_id 参数（?series_id=...）";
    setHeader("err", "URL 缺 series_id");
    return;
  }
  setHeader("", "加载中…");
  try {
    const r = await fetch(`/review/${encodeURIComponent(SERIES_ID)}/meta`);
    if (!r.ok) throw new Error(`meta HTTP ${r.status}`);
    meta = await r.json();
    $("series-label").textContent = `${meta.case_id} / ${meta.series_id} · ${meta.num_slices} 层`;
    // M4 阶段 3：license 展示（静态文案 + meta.license 动态；nnInteractive 修正
    // 产物存在时高亮提示——CC BY-NC-SA 4.0 权重传染标记，不进商用蒸馏训练集）
    showLicense(meta);

    // M2-align 3.5：只加载 1 张原图 + 1 个合并 mask（两个 volume，不多不少）
    const img = { url: `/review/${encodeURIComponent(SERIES_ID)}/image.nii.gz` };
    const mask = { url: `/review/${encodeURIComponent(SERIES_ID)}/mask.nii.gz` };
    const opts = {
      showNIfTIHeaderWarning: false,
      loadingText: "加载中…",
      backColor: [0, 0, 0, 1],
    };

    nvAxial = makeNV($("vp-axial"), { ...opts, dragMode: "pan" });
    await nvAxial.loadVolumes(meta.has_mask ? [img, mask] : [img]);
    nvAxial.setSliceType(niivue.SLICE_TYPE.AXIAL);

    nvCoronal = makeNV($("vp-coronal"), { ...opts });
    await nvCoronal.loadVolumes(meta.has_mask ? [img, mask] : [img]);
    nvCoronal.setSliceType(niivue.SLICE_TYPE.CORONAL);

    nvSagittal = makeNV($("vp-sagittal"), { ...opts });
    await nvSagittal.loadVolumes(meta.has_mask ? [img, mask] : [img]);
    nvSagittal.setSliceType(niivue.SLICE_TYPE.SAGITTAL);

    nvMip = makeNV($("vp-mip"), { ...opts });
    await nvMip.loadVolumes([img]);
    // MIP 决策（M3，M2-REPORT 遗留 1）：实测 niivue 0.69.0 stable 也无原生
    // MIP slice type（SLICE_TYPE 同为 AXIAL/CORONAL/SAGITTAL/MULTIPLANAR/
    // RENDER——M1 遗留"0.69/1.x 有原生 MIP"的前提有误）；真正的 MIP 在 1.x
    // （VOLUME_RENDER_MODE.MAXIMUM），但 1.0.0 仍是 rc 预发布且 API 不兼容
    // （审阅页需重写）。自定义 MIP shader 不可行：vendored UMD bundle 无法
    // 扩展。故 M3 保持体绘制（RENDER）+ 正交方位相机近似 MIP 视觉，真 MIP
    // 升级推迟到 1.x stable（显式决策，记入 M3-REPORT）。
    nvMip.setSliceType(niivue.SLICE_TYPE.RENDER);
    nvMip.setRenderAzimuthElevation(0, 0);  // 正交方位（近似轴位 MIP）

    syncSlidersFromVox();
    applyWindowWW();
    if (meta.has_mask) {
      await loadSegMeta();
    }
    bindScrollSync();
    if (typeof applyM5Defaults === "function") applyM5Defaults(meta);
    setHeader("ok", "已加载");
  } catch (e) {
    setHeader("err", `加载失败：${e.message}`);
    toast(`加载失败：${e.message}`, "err");
  }
}

function setHeader(cls, text) {
  const el = $("hdr-status");
  el.textContent = text;
  el.className = "status " + cls;
}

// ---- 窗宽窗位 ---------------------------------------------------------------
function applyWindowWW() {
  const center = parseFloat($("ww-center").value);
  const width = parseFloat($("ww-width").value);
  $("ww-center-v").textContent = center;
  $("ww-width-v").textContent = width;
  const mn = center - width / 2, mx = center + width / 2;
  for (const nv of [nvAxial, nvCoronal, nvSagittal, nvMip]) {
    if (!nv) continue;
    nv.volumes[0].cal_min = mn;
    nv.volumes[0].cal_max = mx;
  }
}
$("ww-center").addEventListener("input", applyWindowWW);
$("ww-width").addEventListener("input", applyWindowWW);

// ---- 逐 slice 滚动 + mask 同步 ----------------------------------------------
// 同步滚动：主视口驱动其余两个正交面（niivue 内部自动随 sliceMM 联动 mask 重绘）
function currentSliceMM() {
  if (!nvAxial) return 0;
  return nvAxial.scene.sliceMM[0] ?? 0;
}

function syncSlidersFromVox() {
  // niivue 0.53.1 没有 scene.vox；十字线是 fractional 坐标 crosshairPos，
  // 体素坐标 = frac2vox(crosshairPos)，与 niivue 内部 onLocationChange 同式。
  const [x, y, z] = nvAxial.frac2vox(nvAxial.scene.crosshairPos);
  const dims = nvAxial.volumes[0].dims;  // [4, x, y, z]
  $("slice-slider").max = String(dims[3] - 1);
  $("slice-slider").value = String(z);
  $("slice-v").textContent = `${z + 1}/${dims[3]}`;
  $("slice-pos").textContent = `slice ${z + 1}/${dims[3]} · vox (${x},${y},${z})`;
}

$("slice-slider").addEventListener("input", (ev) => {
  const z = parseInt(ev.target.value, 10);
  for (const nv of [nvAxial, nvCoronal, nvSagittal]) {
    if (!nv) continue;
    const mm = nv.volumes[0].matRAS[13] + z * nv.volumes[0].hdr.pixDims[3];
    // scene.vox 不存在（赋值是空操作）；用体素空间移动十字线改切片，
    // 内部即 frac2vox(crosshairPos) + clamp + vox2frac 回写。
    const cur = nv.frac2vox(nv.scene.crosshairPos);
    nv.moveCrosshairInVox(0, 0, z - cur[2]);
  }
  syncSlidersFromVox();
});

function updateSegVisibility() {
  // 逐类独立渲染（M3，M2-REPORT 遗留 3 落地）：niivue 0.53.1 的 overlay
  // fragment shader 直接以 label 值索引 colormap 2D 纹理
  // （uint idx = texture(intensityVol, vx.xyz).r; FragColor = texture(colormap, vec2((idx+0.5)/w, layer)).rgba），
  // 所以 volume.colormapLabel = {R,G,B,A}（每类 RGBA，背景 alpha=0）即可
  // 单个多标签 overlay 实现逐类独立颜色 + 逐类可见性（alpha），无需分通道。
  for (const nv of [nvAxial, nvCoronal, nvSagittal]) {
    if (!nv || nv.volumes.length < 2) continue;
    const nLabels = labelsDoc ? labelsDoc.n_classes : FALLBACK_PALETTE.length * 4;
    const R = new Float32Array(nLabels), G = new Float32Array(nLabels),
          B = new Float32Array(nLabels), A = new Float32Array(nLabels);
    for (let i = 0; i < nLabels; i++) {
      const lv = i + 1;
      const st = segState.get(lv);
      const pal = st ? st.color : FALLBACK_PALETTE[i % FALLBACK_PALETTE.length];
      R[i] = pal[0]; G[i] = pal[1]; B[i] = pal[2];
      // M5-c：逐类 alpha = 渲染源 × 审阅模式；一键剥离时全 0
      let alpha = 0.6;
      if (typeof m5 !== "undefined") {
        const src = m5.renderSourceByClass.get(lv) || "teacher";
        const base = { teacher: 0.6, gt_human: 0.15, guided_draft: 0.25, guided_accepted: 0.6 }[src] ?? 0.6;
        const scale = m5.stripped ? 0 : (m5.renderMode === "quick" ? 1.25 : 0.75);
        alpha = Math.min(0.9, base * scale);
      }
      A[i] = (st && st.visible) ? alpha : 0.0;  // 逐类可见性 = 每类 alpha
    }
    // 构建完整 LUT（Uint8ClampedArray RGBA，按 label 值索引）：0.53.1 的
    // refreshLayers 需要已构建的 .lut（init 时 makeLabelLut 只在构造路径跑）
    const lut = new Uint8ClampedArray((nLabels + 1) * 4);
    lut[0] = 0; lut[1] = 0; lut[2] = 0; lut[3] = 0;  // 背景（label 0）透明
    for (let i = 0; i < nLabels; i++) {
      const o = (i + 1) * 4;
      lut[o] = Math.round(R[i] * 255);
      lut[o + 1] = Math.round(G[i] * 255);
      lut[o + 2] = Math.round(B[i] * 255);
      lut[o + 3] = Math.round(A[i] * 255);
    }
    const vol = nv.volumes[1];
    vol.colormapLabel = { lut: lut, min: 0, max: nLabels, labels: [] };
    vol.colormap = "red";  // 有 colormapLabel 时 shader 用 LUT，colormap 仅占位
    nv.updateGLVolume();
  }
}

function rgbToHex(rgb) {
  return "#" + rgb.map((v) => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
}
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

// ---- M5 审阅会话 -------------------------------------------------------------
// 与 src/bodydonor/review_session.py 同语义（前端镜像，真相源在后端）：
// M5-a 模式切换、M5-b per-class 草稿、M5-c 第三视觉态、M5-d 推理调度、
// 自适应渲染开关、异常驱动队列、修正传播。
// 诚实边界：niivue 0.53.1 的 colormapLabel LUT 按 label 值着色、无描边通道，
// “虚线轮廓”在画布上表达为低透明填充 + 琥珀色 + 角标 + 类别行虚线边框，
// 不是逐像素描边（见 M5-REPORT §3.3）。
const m5 = {
  mode: "browse",  // browse | prompt_pos | prompt_neg | bbox | scribble
  spaceHeld: false,
  currentClass: null,  // label_value（点类别行选定）
  promptsByClass: new Map(),  // label_value -> [{type,x,y,z,include,class}]
  drafts: new Map(),  // label_value -> "draft" | "accepted"
  renderMode: "fine",  // fine | quick（CT/MRI 默认 fine，X-ray 默认 quick）
  stripped: false,
  renderSourceByClass: new Map(),  // label_value -> teacher | guided_draft | guided_accepted
  inferSeq: 0,  // M5-d：推理 version，去重旧结果
  inferPending: false,
  sessionId: (crypto.randomUUID ? crypto.randomUUID() : `sess-${Date.now()}`),
  bboxNoteShown: false,
};
const M5_MODE_LABEL = {
  browse: "浏览 ·", prompt_pos: "正向提示 +", prompt_neg: "负向提示 −",
  bbox: "包围框 &", scribble: "涂鸦 *",
};
const M5_MODE_BTN = {
  browse: "mode-none", prompt_pos: "mode-prompt-pos", prompt_neg: "mode-prompt-neg",
  bbox: "mode-bbox", scribble: "mode-scribble",
};
const M5_RENDER_ALPHA = { teacher: 0.6, gt_human: 0.15, guided_draft: 0.25, guided_accepted: 0.6 };

function m5ClassName(lv) {
  const st = segState.get(lv);
  return st ? st.name : `label-${lv}`;
}
function m5PromptCount() {
  let n = 0;
  m5.promptsByClass.forEach((ps) => { n += ps.length; });
  return n;
}
function updateModeBadge() {
  const el = $("mode-badge");
  if (!el) return;
  let txt = M5_MODE_LABEL[m5.mode];
  if (m5.currentClass != null) txt += ` ${m5ClassName(m5.currentClass)}`;
  const n = m5PromptCount();
  if (n) txt += ` · ${n} 提示`;
  if (m5.inferPending) txt += " · 推理中…";
  const hasDraft = [...m5.drafts.values()].includes("draft");
  const hasAccepted = [...m5.drafts.values()].includes("accepted");
  if (hasDraft) txt += " · nnInteractive · 未确认";
  if (hasAccepted) txt += " · nnI ✓";
  el.textContent = txt;

  el.classList.toggle("accepted", !hasDraft && hasAccepted);
}
function setM5Mode(m) {
  m5.mode = m;
  for (const [mode, id] of Object.entries(M5_MODE_BTN)) {
    const b = $(id);

$("mode-prompt-pos").addEventListener("click", () => setM5Mode("prompt_pos"));

// M5-a 键盘：P/N/B/S 切模式；Esc 回浏览不清提示；空格按住 = 平移（不落提示）
window.addEventListener("keydown", (ev) => {
  const tag = (ev.target?.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === " ") {
    ev.preventDefault();
    m5.spaceHeld = true;
    return;
  }
  if (k === "escape") {
    setM5Mode("browse");
    toast("已回浏览模式（提示保留）");
    return;
  }
  if (k === "p") setM5Mode("prompt_pos");
  else if (k === "n") setM5Mode("prompt_neg");
  else if (k === "b") setM5Mode("bbox");
  else if (k === "s") setM5Mode("scribble");
});

// M5-d：推理调度（前端镜像版）：version 去重 + 异步不锁 UI
let m5InferTimer = null;
function m5ScheduleInference(lv) {
  clearTimeout(m5InferTimer);
  m5InferTimer = setTimeout(() => m5RunInference(lv), 300);
}
async function m5RunInference(lv) {
  const prompts = m5.promptsByClass.get(lv) || [];
  if (!prompts.length) return;
  // 提示合并：同类同向 point ±1 体素去重（与后端 merge_prompts 同口径）；
  // bbox / scribble 不合并（形状语义不同），全量随请求发送。
  const merged = [];
  const seenPoints = [];
  for (const p of prompts) {
    if (p.type !== "point") { merged.push(p); continue; }
    const dup = seenPoints.some((q) => q.include === p.include
      && Math.abs(q.x - p.x) <= 1 && Math.abs(q.y - p.y) <= 1 && Math.abs(q.z - p.z) <= 1);
    if (!dup) { seenPoints.push(p); merged.push(p); }
  }
  if (!merged.length) return;
  const version = ++m5.inferSeq;
  m5.inferPending = true;
  updateModeBadge();
  try {
    const r = await fetch(`/review/${encodeURIComponent(SERIES_ID)}/nninteractive-correct`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompts: merged.map((p) => p.type === "bbox"
          ? { type: "bbox", bbox: p.bbox }
          : p.type === "scribble"
            ? { type: "scribble", points: p.points }
            : { type: "point", x: p.x, y: p.y, z: p.z, include: p.include }),
        target_label: lv,
      }),
    });
    if (version !== m5.inferSeq) return;  // 旧 version 结果丢弃（快速连点不出错乱）
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const out = await r.json();
    m5.drafts.set(lv, "draft");
    m5.renderSourceByClass.set(lv, "guided_draft");
    renderDraftList();
    updateSegVisibility();
    toast(`${m5ClassName(lv)} 草稿更新（虚线琥珀 + 低透明，nnInteractive · 未确认，${out.n_target_voxels ?? "?"} 体素）`, "ok");
  } catch (e) {
    if (version !== m5.inferSeq) return;
    toast(`推理失败（提示已保留，可重试）：${e.message}`, "err");
  } finally {
    if (version === m5.inferSeq) m5.inferPending = false;
    updateModeBadge();
  }
}

// 轴位视口：点选 / 框选 / 涂鸦落提示（空格按住时不落；悬停只预览不推理）
const axialBox = $("vp-axial");
const previewEl = $("prompt-preview");
let dragStart = null;      // bbox 起点 vox
let scribblePts = null;    // 涂鸦轨迹
function m5CurrentVox(ev) {
  if (!nvAxial) return null;
  if (ev) {
    // 指针事件坐标直接换算：pointerdown 先于 niivue 的 mousedown 触发，
    // 此时 crosshairPos 还是上一次的位置，直接读会落后一次点击（bbox 起点/
    // scribble 首点实测落在旧十字线处）。用 niivue 自身的 canvasPos2frac
    //（入参 device px = CSS px × dpr，与其 touch 路径同式）再 frac2vox，
    // 与 mouseClick 落十字线同源。
    const canvas = axialBox.querySelector("canvas");
    if (!canvas) return null;
    const rect = canvas.getBoundingClientRect();
    const dpr = (nvAxial.uiData && nvAxial.uiData.dpr) || window.devicePixelRatio || 1;
    const frac = nvAxial.canvasPos2frac([(ev.clientX - rect.left) * dpr, (ev.clientY - rect.top) * dpr]);
    if (!frac || frac[0] < 0) return null;  // 点在体数据之外
    const [x, y, z] = nvAxial.frac2vox(frac);
    return { x, y, z };
  }
  // 无事件时读当前十字线（滑条/传播按钮等场景）。
  const [x, y, z] = nvAxial.frac2vox(nvAxial.scene.crosshairPos);
  return { x, y, z };
}
function m5PickClass() {
  if (m5.currentClass != null) return m5.currentClass;
  const first = [...segState.entries()].find(([, s]) => s.visible);
  return first ? first[0] : null;
}
function m5AddPrompt(lv, prompt) {
  const arr = m5.promptsByClass.get(lv) || [];
  arr.push({ ...prompt, class: m5ClassName(lv) });
  m5.promptsByClass.set(lv, arr);
  if (!m5.drafts.has(lv)) m5.drafts.set(lv, "draft");
  renderDraftList();
  updateModeBadge();
}
axialBox.addEventListener("pointerdown", (ev) => {
  if (m5.mode === "browse" || m5.spaceHeld) return;
  const vox = m5CurrentVox(ev);
  if (!vox) return;
  if (m5.mode === "bbox") dragStart = vox;
  else if (m5.mode === "scribble") scribblePts = [vox];
});
axialBox.addEventListener("pointermove", (ev) => {
  // 悬停预览提示落点（不触发推理）
  if (previewEl) {
    const rect = axialBox.getBoundingClientRect();
    previewEl.style.left = `${ev.clientX - rect.left}px`;
    previewEl.style.top = `${ev.clientY - rect.top}px`;
    if (m5.mode === "prompt_pos") { previewEl.textContent = "+"; previewEl.className = "prompt-preview pos"; previewEl.hidden = false; }
    else if (m5.mode === "prompt_neg") { previewEl.textContent = "−"; previewEl.className = "prompt-preview neg"; previewEl.hidden = false; }
    else if (m5.mode === "bbox") { previewEl.textContent = "&"; previewEl.className = "prompt-preview box"; previewEl.hidden = false; }
    else if (m5.mode === "scribble") { previewEl.textContent = "*"; previewEl.className = "prompt-preview scribble"; previewEl.hidden = false; }
    else previewEl.hidden = true;
  }
  if (m5.mode === "scribble" && scribblePts) {
    const vox = m5CurrentVox(ev);
    if (vox) scribblePts.push(vox);
  }
});
axialBox.addEventListener("pointerleave", () => { if (previewEl) previewEl.hidden = true; });
axialBox.addEventListener("pointerup", (ev) => {
  if (m5.mode === "browse" || m5.spaceHeld) { dragStart = null; scribblePts = null; return; }
  const lv = m5PickClass();
  if (lv == null) { toast("先在右侧类别行点选当前类", "err"); dragStart = null; scribblePts = null; return; }
  const vox = m5CurrentVox(ev);
  if (!vox) return;
  if (m5.mode === "prompt_pos" || m5.mode === "prompt_neg") {
    m5AddPrompt(lv, { type: "point", x: vox.x, y: vox.y, z: vox.z, include: m5.mode === "prompt_pos" });
    m5ScheduleInference(lv);
  } else if (m5.mode === "bbox" && dragStart) {
    m5AddPrompt(lv, { type: "bbox", bbox: [[Math.min(dragStart.x, vox.x), Math.max(dragStart.x, vox.x) + 1], [Math.min(dragStart.y, vox.y), Math.max(dragStart.y, vox.y) + 1], [Math.min(dragStart.z, vox.z), Math.max(dragStart.z, vox.z) + 1]] });
    if (!m5.bboxNoteShown) { m5.bboxNoteShown = true; toast("包围框提示已记录并触发推理（2D 框：同切片维 [d,d+1]）"); }
    m5ScheduleInference(lv);
  } else if (m5.mode === "scribble" && scribblePts && scribblePts.length) {
    m5AddPrompt(lv, { type: "scribble", points: scribblePts.map((p) => [p.x, p.y, p.z]) });
    if (!m5.bboxNoteShown) { m5.bboxNoteShown = true; toast("涂鸦提示已记录并触发推理"); }
    m5ScheduleInference(lv);
  }
  dragStart = null;
  scribblePts = null;
});

// M5 修正传播：当前层当前类 → 相邻层
$("btn-propagate").addEventListener("click", async () => {
  const vox = m5CurrentVox();
  const lv = m5PickClass();
  if (!vox || lv == null) { toast("传播需要当前切片与当前类", "err"); return; }
  const radius = parseInt($("prop-radius").value, 10) || 1;
  try {
    const r = await fetch(`/review/${encodeURIComponent(SERIES_ID)}/propagate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ slice: vox.z, class_label: lv, radius }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    const out = await r.json();
    toast(`已传播 ${out.propagated_voxels} 体素到相邻层（新版本 v${out.version}），刷新页面查看`, "ok");
  } catch (e) {
    toast(`传播失败：${e.message}`, "err");
  }
});

// M5-b/M5-e 提交审阅：每类调一次 submit-nni，建 MaskVersion(source=nninteractive_guided)
$("btn-submit-nni").addEventListener("click", async () => {
  const accepted = [...m5.drafts.entries()].filter(([, s]) => s === "accepted").map(([lv]) => lv);
  if (!accepted.length) { toast("无已确认的类可提交（先点「确认本类」）", "err"); return; }
  let done = 0;
  for (const lv of accepted) {
    const prompts = m5.promptsByClass.get(lv) || [];
    try {
      const r = await fetch(`/review/${encodeURIComponent(SERIES_ID)}/submit-nni`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          target_label: lv,
          prompts,
          acceptedClasses: [m5ClassName(lv)],
          sessionId: m5.sessionId,
          baselineTeacherVersion: null,  // 本页 meta 未带基线版本，后端不猜，记 null
        }),
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
      const out = await r.json();
      done++;
      toast(`${m5ClassName(lv)} 已提交为 MaskVersion v${out.version}（nninteractive_guided，${out.n_corrected_voxels} 体素；刷新后成为新基线）`, "ok");
    } catch (e) {
      toast(`${m5ClassName(lv)} 提交失败：${e.message}`, "err");
    }
  }
  if (done) { renderDraftList(); updateModeBadge(); }
});

// 未提交切病例确认框（离开页面时）
window.addEventListener("beforeunload", (ev) => {
  if (m5.drafts.size) {
    ev.preventDefault();
    ev.returnValue = "";
  }
});

// M5 自适应渲染开关
function setRenderMode(m) {
  m5.renderMode = m;
  $("render-quick").classList.toggle("active", m === "quick");
  $("render-fine").classList.toggle("active", m === "fine");
  updateSegVisibility();
}
$("render-quick").addEventListener("click", () => { setRenderMode("quick"); toast("快速定位：弱化轮廓、强化类别色块"); });
$("render-fine").addEventListener("click", () => { setRenderMode("fine"); toast("精细边界：强化 GT 与预测边界差异，偏差区域脉动提示"); });
$("btn-strip").addEventListener("click", () => {
  m5.stripped = !m5.stripped;
  $("btn-strip").textContent = m5.stripped ? "恢复 overlay" : "一键剥离 overlay";
  updateSegVisibility();
  toast(m5.stripped ? "overlay 已剥离（只看原图）" : "overlay 已恢复");
});

// M5 异常驱动队列
async function loadRiskQueue() {
  const el = $("risk-list");
  try {
    const r = await fetch(`/review/${encodeURIComponent(SERIES_ID)}/risk-queue`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const body = await r.json();
    el.innerHTML = body.queue.map((e) => `<div class="risk-item ${e.risk === "high" ? "risk-pulse" : ""}" data-class-name="${e.class}">
      <span class="risk-${e.risk}">${e.risk === "high" ? "高" : e.risk === "medium" ? "中" : "低"}</span>
      <span title="${e.reason}">${e.class}</span>
      <span class="dice">${e.dice.toFixed(4)}</span>
    </div>`).join("");
    el.querySelectorAll(".risk-item").forEach((row) => row.addEventListener("click", () => {
      const name = row.dataset.className;
      const entry = [...segState.entries()].find(([, s]) => s.name === name);
      if (!entry) { toast(`队列类 ${name} 不在本序列 mask 内`, "err"); return; }
      setAllSeg(false);
      const st = segState.get(entry[0]);
      if (st) st.visible = true;
      m5.currentClass = entry[0];
      updateSegVisibility();
      document.querySelectorAll("#seg-list input[type=checkbox]").forEach((cb) => {
        cb.checked = parseInt(cb.dataset.class, 10) === entry[0];
      });
      updateModeBadge();
      toast(`已聚焦 ${name}（仅显示该类）`);
    }));
  } catch (e) {
    if (el) el.innerHTML = `<span style="color:var(--dim)">队列不可用：${e.message}（先跑学生 hold-out 评估）</span>`;
  }
}

function applyM5Defaults(m) {
  // 默认审阅模式（与后端 default_render_mode 同口径）：X-ray → quick，其余 fine
  const mod = (m?.modality || "").toUpperCase();
  setRenderMode(["XR", "X-RAY", "XRAY", "DX", "CR"].includes(mod) ? "quick" : "fine");
  loadRiskQueue();
  updateModeBadge();
}

loadSeries();
</script>
