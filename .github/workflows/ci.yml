# BodyDonor CI 最小集（M0 + M1，proposal §11 CI 最小集）：
#   lint + 单测 + zip 炸弹负测试 + 许可白名单负测试 + AgentContext PHI 负测试。
#   M1：zip 炸弹三 case 负测试（tests/test_zip_bomb.py）+ ingest/De-ID/试用计数（tests/test_ingest.py、
#   tests/test_deid_usage.py、tests/test_api_ingest.py）。
# GPU 推理不进 CI（显存/耗时基线手工汇报）。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Ruff lint
        run: uvx ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install (locked, all extras)
        run: uv sync --all-extras --locked
      - name: Unit tests
        run: uv run pytest -v -m "not local_artifacts"
        # 覆盖：许可白名单负测试（tests/test_license_whitelist.py）、
        # AgentContext PHI 负测试（tests/test_agent_context_phi.py）、
        # Storage/Queue/Config、FastAPI 骨架、
        # DB 纪律 + Alembic upgrade/downgrade（tests/test_db.py）。
        # -m "not local_artifacts"：依赖本机 ~/data/BodyDonor 或 eval/*.json
        # 运行产物的测试跳过（CI 干净检出无这些文件），逻辑分支由合成 fixture
        # 覆盖（marker 见 pyproject.toml）。
      - name: Alembic migration roundtrip (fresh db)
        run: |
          uv run alembic -x db_url=sqlite:///./ci_mig.db upgrade head
          uv run alembic -x db_url=sqlite:///./ci_mig.db downgrade base
          uv run alembic -x db_url=sqlite:///./ci_mig.db upgrade head
          rm -f ci_mig.db
      - name: License whitelist negative test (CLI exit code)
        run: |
          uv run bodydonor license check total       # 允许 -> exit 0
          ! uv run bodydonor license check brain_aneurysm   # 禁用 -> exit 非 0
          ! uv run bodydonor license check heartchambers_highres  # licensed 未加白 -> exit 非 0
