# BodyDonor 本体映射表 v1（M2，proposal §3）
# 自然语言标签 -> TotalSegmentator `total` 任务类别。
# 字段：nl_label / synonyms（中英双语同义词，Q1）/ snomed_ct / uberon / totalseg_class / status
# status: active | deprecated（deprecated 不参与查询，保留供 diff/回溯）
#
# 本文件是产品资产（不是补丁）：用户消歧写回走 overrides.yaml（同目录，与本表分离），
# git diff 本表 = 领域变更评审，git diff overrides = 用户决策记录。
#
# SNOMED CT 编码取常用临床概念 ID；Uberon 取解剖学本体 ID。编码人工核对，
# M5 引全量 SNOMED/Uberon 图谱后再机校。
