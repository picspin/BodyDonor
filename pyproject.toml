[project]
name = "bodydonor"
version = "0.1.0"
description = "BodyDonor — medical imaging segmentator agent (research/annotation tool, non-diagnostic)"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
# M1 ingest 依赖：pydicom / SimpleITK 在 M1 加 lock，M0 只装后端骨架最小集
ingest = [
    "pydicom>=3.0",
    "SimpleITK>=2.4",
    "nibabel>=5.3",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
bodydonor = "bodydonor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bodydonor"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
